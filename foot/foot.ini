# foot config — see foot.ini(5)
# Started as a server by sway (`foot --server`); windows open with `footclient`.

# Catppuccin Mocha (https://github.com/catppuccin/foot)
include=~/.config/foot/catppuccin-mocha.ini

[main]
font=JetBrainsMono Nerd Font Mono:size=12
pad=8x8

[bell]
urgent=no
notify=no

[scrollback]
lines=100000

[colors]
# Same see-through background as the old terminator profile
alpha=0.85
