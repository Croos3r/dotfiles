customCommands:
  - key: "C"
    context: "files"
    description: "Create new conventional commit"
    prompts:
      - type: "menu"
        key: "Type"
        title: "Type of change"
        options:
          - name: "build"
            description: "Changes that affect the build system or external dependencies"
            value: "build"
            key: "b"
          - name: "feat"
            description: "A new feature"
            value: "feat"
            key: "f"
          - name: "fix"
            description: "A bug fix"
            value: "fix"
            key: "x"
          - name: "chore"
            description: "Other changes that don't modify src or test files"
            value: "chore"
            key: "c"
          - name: "ci"
            description: "Changes to CI configuration files and scripts"
            value: "ci"
            key: "i"
          - name: "docs"
            description: "Documentation only changes"
            value: "docs"
            key: "d"
          - name: "perf"
            description: "A code change that improves performance"
            value: "perf"
            key: "p"
          - name: "refactor"
            description: "A code change that neither fixes a bug nor adds a feature"
            value: "refactor"
            key: "r"
          - name: "revert"
            description: "Reverts a previous commit"
            value: "revert"
            key: "v"
          - name: "style"
            description: "Changes that do not affect the meaning of the code"
            value: "style"
            key: "s"
          - name: "test"
            description: "Adding missing tests or correcting existing tests"
            value: "test"
            key: "t"
      - type: "input"
        title: "Scope"
        key: "Scope"
        initialValue: ""
      - type: "menu"
        key: "Breaking"
        title: "Breaking change"
        options:
          - name: "no"
            value: "no"
            key: "n"
          - name: "yes"
            value: "!"
            key: "y"
      - type: "input"
        title: "message"
        key: "Message"
        initialValue: ""
      - type: "input"
        title: "description"
        key: "Description"
    command: 'git commit --message ''{{.Form.Type}}{{ if .Form.Scope }}({{ .Form.Scope }}){{ end }}{{ if eq .Form.Breaking "!" }}!{{ end }}: {{.Form.Message}}'' --message ''{{.Form.Description}}'''
    loadingText: "Creating conventional commit..."

# Catppuccin Mocha, blue accent (https://github.com/catppuccin/lazygit)
gui:
  theme:
    activeBorderColor:
      - "#89b4fa"
      - bold
    inactiveBorderColor:
      - "#a6adc8"
    optionsTextColor:
      - "#89b4fa"
    selectedLineBgColor:
      - "#313244"
    cherryPickedCommitBgColor:
      - "#45475a"
    cherryPickedCommitFgColor:
      - "#89b4fa"
    unstagedChangesColor:
      - "#f38ba8"
    defaultFgColor:
      - "#cdd6f4"
    searchingActiveBorderColor:
      - "#f9e2af"
  authorColors:
    "*": "#b4befe"
