set			-g					prefix 						C-x
setw		-g					mode-keys 					vi
setw		-g					pane-base-index				1
set			-g					base-index					1
set			-g  				default-terminal 			"tmux-256color"
set			-ga 				terminal-features 			",*256col*:RGB"
set			-ga 				terminal-features 			",xterm-256color:RGB"
set			-g 					renumber-windows			on
set			-ga 				terminal-features 			",foot*:RGB:usstyle:clipboard:extkeys"
set			-s 					extended-keys				on
set			-g 					set-clipboard				on
set			-s 					escape-time					10
set			-g 					focus-events				on
set			-g 					history-limit				100000
set 		-gF 				display-panes-active-colour "red"

unbind 							C-b
unbind							p
unbind 							C-z

bind-key 						C-x	send-prefix
bind-key	-T copy-mode-vi 	v 	send 					-X begin-selection
bind-key	-T copy-mode-vi 	C-v send 					-X rectangle-toggle
bind-key	-T copy-mode-vi 	y 	send 					-X copy-selection-and-cancel
bind-key 						c 	new-window 				-c "#{pane_current_path}"
bind-key						C	new-window 				-c "#{pane_current_path}"		-a
bind-key 						% 	split-window 	  		-c "#{pane_current_path}"		-h
bind-key 						'ù' split-window	  		-c "#{pane_current_path}"		-v
bind-key						b	previous-window

# tmux-floax
set			-g					@floax-bind					f
set			-g					@floax-bind-embed			e
set			-g					@floax-bind-unlock			u
set			-g					@floax-border-color			default
set			-g					@floax-text-color			default
bind-key						r	source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"
run-shell	-b 					'~/.tmux/plugins/tmux-floax/floax.tmux'

# Catppuccin Mocha (https://github.com/catppuccin/tmux), installed by install.sh
set			-g					@catppuccin_flavor			"mocha"
set			-g					@catppuccin_window_status_style "rounded"
run-shell						'~/.local/share/tmux/plugins/catppuccin/tmux/catppuccin.tmux'
set			-g					status-left					""
set			-g					status-right-length			100
set			-g					status-right				"#{E:@catppuccin_status_session}"
